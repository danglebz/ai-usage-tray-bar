name: Release Please

# Conventional Commits landing on main decide the next version. release-please keeps a
# release PR up to date with the version bump and the CHANGELOG entry it derives from
# them; merging that PR is what tags the version and cuts the GitHub Release.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# Two of these running at once both try to open the release PR, and the second one fails
# with "a pull request already exists" - which is how it went the first time a run sat in
# the queue long enough for the next push to catch up with it. Queue them instead; never
# cancel, since a cancelled run could stop between tagging and uploading the exe.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # release-please pushes its tag with GITHUB_TOKEN, and GitHub will not start a workflow
  # from an event that token raised - so release.yml never sees that tag. The exe is built
  # here instead and uploaded onto the release release-please has just created. `gh release
  # upload` only adds assets, so the notes release-please wrote are left alone.
  build:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run verify

      - run: pnpm exec electron-builder --win --publish never

      - name: Attach the portable exe
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: gh release upload "$TAG" dist/*.exe --clobber
