name: CI

on:
  # Branches are covered by the pull_request trigger; listing them here as well ran
  # every PR branch twice on the same commit, and Windows runner minutes bill at 2x.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A second push to a branch makes the run already in flight pointless. main is exempt:
# its runs are what the CI badge and the release history read.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    # Windows because that is the only platform the app targets (package.json "os"),
    # and pnpm refuses to install anywhere else.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run test
