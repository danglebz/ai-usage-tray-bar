name: CI

on:
  # Branches are covered by the pull_request trigger; listing them here as well ran
  # every PR branch twice on the same commit, and Windows runner minutes bill at 2x.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A second push to a branch makes the run already in flight pointless. main is exempt:
# its runs are what the CI badge and the release history read.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    # Windows because that is the only platform the app targets (package.json "os"),
    # and pnpm refuses to install anywhere else.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run test

      # Starts the real app in demo mode and expects a screenshot back. Everything above
      # runs without Electron, so only this step catches an upgrade that breaks at launch.
      # Kept out of `pnpm verify`, which must not open windows. The app's own run is capped
      # at 60 s; the step limit just keeps a hung runner from burning Windows minutes.
      - id: smoke
        run: pnpm run smoke
        timeout-minutes: 5
        env:
          SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/smoke

      # When the check rejects the screenshot, keep what the app drew: a byte count alone
      # does not say whether the panel was blank, half painted or just small. Seven days is
      # plenty for a debugging aid. Gated on the smoke step so an earlier failure (lint, say)
      # does not go looking for a screenshot that was never taken.
      - if: failure() && steps.smoke.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: smoke-screenshot
          path: ${{ runner.temp }}/smoke
          retention-days: 7
