name: Release

# Pushing a tag such as v0.2.0 builds the portable exe and attaches it to a GitHub Release
# for that tag. `pnpm version minor && git push --follow-tags` is the normal way to get here.
on:
  push:
    tags: ["v*"]
  # A tag pushed in the same commit range that introduces this file does not
  # trigger it - GitHub does not know the workflow yet. Re-run it by hand here
  # instead of deleting and re-pushing the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build, such as v0.1.0
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    # github.ref_name is the tag on a tag push and the branch on a manual run, so the
    # dispatch input is what makes the two paths agree from here on.
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Tag must match package.json
        shell: bash
        run: |
          tag="${TAG#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match package.json version $version" >&2
            exit 1
          fi

      - run: pnpm run verify

      - run: pnpm exec electron-builder --win --publish never

      - name: Release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          version="${TAG#v}"
          # Everything between this version's heading and the next "## [" heading.
          awk -v v="$version" '
            $0 ~ "^## \[" v "\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "No CHANGELOG.md entry for $version; using generated notes." > notes.md; fi

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          files: dist/*.exe
          body_path: notes.md
          generate_release_notes: true
