name: Release

# The manual path. Normal releases go through release-please, which tags the version and
# builds the exe itself in release-please.yml - its tag is pushed with GITHUB_TOKEN and so
# never reaches this file. What is left for here: a `v*` tag pushed by a person, and the
# dispatch below for rebuilding the exe of a tag that already exists.
#
# Note that a dispatch checks the tag out as it was: rebuilding a tag whose tree fails
# `pnpm verify` today cannot succeed, however healthy main is.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build, such as v0.1.0
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    # github.ref_name is the tag on a tag push and the branch on a manual run, so the
    # dispatch input is what makes the two paths agree from here on.
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Tag must match package.json
        shell: bash
        run: |
          tag="${TAG#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match package.json version $version" >&2
            exit 1
          fi

      - run: pnpm run verify

      - run: pnpm exec electron-builder --win --publish never

      - name: Release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          version="${TAG#v}"
          # Everything between this version's heading and the next "## [" heading.
          awk -v v="$version" '
            $0 ~ "^## \[" v "\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "No CHANGELOG.md entry for $version; using generated notes." > notes.md; fi

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          files: dist/*.exe
          body_path: notes.md
          generate_release_notes: true
