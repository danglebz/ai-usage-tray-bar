name: Something else is broken
description: The app itself - tray, panel, settings, notifications, startup, packaging.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected instead
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: 0.1.0, or the commit if running from source
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
  - type: dropdown
    id: how
    attributes:
      label: How are you running it?
      options:
        - Portable exe from Releases
        - Start AI Usage Tray.cmd
        - pnpm start
    validations:
      required: true
